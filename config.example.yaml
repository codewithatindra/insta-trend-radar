# Copy to config.yaml and edit.

# ---- India Pulse (python -m trend_radar india) ----
# What India is searching (Google Trends India) and watching (YouTube India), filtered to a niche.
# Niches: all, cricket, bollywood, festivals, startups, finance, travel, food, fashion, beauty,
# fitness, tech, news. Anything else is used as a keyword.
india_niche: all
india_sources: [google, youtube]   # youtube needs YOUTUBE_API_KEY in .env (free)
geo: IN
india_keywords: []                 # extra words to match, e.g. [nomadiq, goa, "मौसम"]

# ---- Hashtag radar (python -m trend_radar run / watch) ----
# Your niche. Presets: fashion, travel, fitness, food, tech, beauty, cricket, bollywood,
# festivals, startups, finance.
# Anything else works too - it becomes the first seed hashtag.
niche: travel

# Live sources: bluesky and mastodon need no account. Add instagram only if you have Meta Graph API access.
sources: [bluesky, mastodon]
mastodon_instance: mastodon.social

# Extra seed hashtags to watch (optional). If instagram is on: max 30 unique hashtags per 7 days.
hashtags:
  - incredibleindia

rules:
  posts_per_hashtag: 50   # posts fetched per hashtag per edge (top + recent)
  min_posts: 3            # a hashtag needs at least this many posts to count
  min_growth: 2.0         # alert when it appears 2x more than last run
  top_n: 5                # max trends per alert
  cooldown_hours: 24      # don't re-alert the same hashtag within this window
  max_age_days: 3         # only count posts from the last N days

database: data/trend_radar.sqlite

# Where alerts go. Use "${ENV_NAME}" to read secrets from environment / .env.
alerts:
  - type: console
  # - type: telegram
  #   bot_token: "${TELEGRAM_BOT_TOKEN}"
  #   chat_id: "${TELEGRAM_CHAT_ID}"
  # - type: webhook          # Slack incoming webhook (key: text) or Discord (key: content)
  #   url: "${WEBHOOK_URL}"
  #   key: text
  # - type: email
  #   host: smtp.gmail.com
  #   port: 587
  #   username: "${SMTP_USER}"
  #   password: "${SMTP_PASSWORD}"
  #   to: you@example.com
api_version: v26.0   # Graph API version
